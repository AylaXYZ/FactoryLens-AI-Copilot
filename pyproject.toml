[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorylens-semantic-rag-agent"
version = "0.2.0"
description = "A semantic RAG and maintenance workflow agent for manufacturing knowledge operations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [{name = "Ayla"}]
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-core>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "langgraph>=0.2,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.41,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
models = [
  "langchain-openai>=0.3,<2",
  "langchain-ollama>=0.2,<2",
]
semantic = [
  "sentence-transformers>=3,<6",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "reportlab>=4.2,<5",
  "ruff>=0.8,<1",
]

[project.scripts]
factorylens-api = "factorylens.api:run"
factorylens-eval = "factorylens.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
