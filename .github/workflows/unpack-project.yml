name: Unpack project archive

on:
  push:
    paths:
      - FactoryLens-AI-Copilot.zip
      - .github/workflows/unpack-project.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand reviewed project archive
        shell: bash
        run: |
          unzip -o FactoryLens-AI-Copilot.zip
          git restore -- .github/workflows/test.yml
          rm -f FactoryLens-AI-Copilot.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "发布 FactoryLens AI Copilot 完整源码"
          git push
